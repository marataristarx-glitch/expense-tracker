{{define "content"}}
<div style="text-align: right; margin-bottom: 10px;">
    <form action="/logout" method="POST" style="display:inline;">
        <button type="submit">Выйти из аккаунта</button>
    </form>
</div>

<h4>Добавить расход</h4>
<form action="/" method="POST">
    <label>Сумма трат:</label><br>
    <input type="number" step="0.01" name="amount" required placeholder="Например: 250.50"><br>
    
    <label>Категория:</label><br>
    <select name="category_id" required>
        {{range .Categories}}
            <option value="{{.ID}}">{{.Name}}</option>
        {{end}}
    </select><br>

    <label>Что купил (описание):</label><br>
    <input type="text" name="description" required placeholder="Например: Обед в столовой"><br>
    
    <label>Когда (дата):</label><br>
    <input type="date" name="date" required><br>
    
    <button type="submit">Добавить в базу данных</button>
</form>

<hr>

<h4>Фильтр расходов</h4>
<form action="/" method="GET">
    <label>Категория:</label>
    <select name="category">
        <option value="">Все категории</option>
        {{range .Categories}}
            <option value="{{.ID}}" {{if eq (printf "%d" .ID) $.SelectedCategory}}selected{{end}}>
                {{.Name}}
            </option>
        {{end}}
    </select>

    <label>От:</label>
    <input type="date" name="from" value="{{.DateFrom}}">

    <label>До:</label>
    <input type="date" name="to" value="{{.DateTo}}">

    <button type="submit">Фильтровать</button>
    <a href="/">Сбросить</a>
</form>

<h4>История расходов из базы данных</h4>
<table>
    <thead>
        <tr>
            <th>Сумма</th>
            <th>Категория</th>
            <th>Описание</th>
            <th>Дата</th>
            <th>Действие</th>
        </tr>
    </thead>
    <tbody>
        {{range .Expenses}}
        <tr>
            <td>{{.Amount}} руб.</td>
            <td>{{.CategoryName}}</td>
            <td>{{.Description}}</td>
            <td>{{.Date}}</td>
            <td>
                <form action="/delete" method="POST" style="display:inline; margin:0; padding:0;">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit" class="btn-del" onclick="return confirm('Реально удалить запись?')">Удалить</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="5" style="text-align: center; color: #888;">Записей не найдено.</td>
        </tr>
        {{end}}
    </tbody>
</table>

{{end}}
