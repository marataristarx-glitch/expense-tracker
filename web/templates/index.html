{{define "content"}}

<h4>Добавить расход</h4>
<!-- Форма фигачит POST запрос на корень сайта-->
<form action="/" method="POST">
    <label>Сумма трат:</label><br>
    <input type="number" step="0.01" name="amount" required placeholder="Например: 250.50"><br>
    
    <label>Что купил (описание):</label><br>
    <input type="text" name="description" required placeholder="Например: Обед в столовой"><br>
    
    <label>Когда (дата):</label><br>
    <input type="date" name="date" required><br>
    
    <button type="submit">Добавить в базу данных</button>
</form>

<h4>История расходов из базы данных</h4>
<table>
    <thead>
        <tr>
            <th>Сумма</th>
            <th>Описание</th>
            <th>Дата</th>
            <th>Действие</th>
        </tr>
    </thead>
    <tbody>
        <!-- Перебираем все расходы, которые нам прислал Go из SQLite -->
        {{range .}}
        <tr>
            <td>{{.Amount}} руб.</td>
            <td>{{.Description}}</td>
            <td>{{.Date}}</td>
            <td>
                <!-- Форма-кнопка для быстрого удаления строки по её ID -->
                <form action="/delete" method="POST" style="display:inline; margin:0; padding:0;">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit" class="btn-del" onclick="return confirm('Реально удалить запись?')">Удалить</button>
                </form>
            </td>
        </tr>
        {{else}}
        <!-- Если база пустая, покажем эту строчку -->
        <tr>
            <td colspan="4" style="text-align: center; color: #888;">В базе пока нет записей. Добавь что-нибудь сверху!</td>
        </tr>
        {{end}}
    </tbody>
</table>

{{end}}
