{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт личных трат</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        header { background: #333; color: #fff; padding: 15px; text-align: center; border-radius: 5px; }
        .container { background: #fff; padding: 20px; margin-top: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { display: flex; flex-direction: column; max-width: 400px; gap: 10px; margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 16px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <header>
        <h1>Учёт личных трат — Панель управления</h1>
    </header>
    <div class="container">
        {{template "content" .}}
    </div>
</body>
</html>
{{end}}
